name: Baseline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test repository safeguards and baseline records
        run: python3 -m unittest discover -s tests/baseline -v
      - name: Check public baseline records
        run: python3 -m tools.baseline.check
      - name: Inspect tracked publication contents
        run: python3 -m tools.baseline.publication_guard
